name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          find src tests -name "*.js" -exec node --check {} +
      - name: gc-blescan (Funk, natives Hilfsprogramm) übersetzen
        run: gcc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/gc-blescan" native/gc-blescan.c
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Shellcheck scripts/
        run: |
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck -S warning "${files[@]}"
          fi

  rpi-image-config:
    # Schneller Struktur-Test des Raspberry-Pi-Images (kein Image-Bau; der
    # läuft im Release bzw. per Hand über rpi-image.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: nmcli für den Keyfile-Test (nur entpackt, kein NetworkManager-Dienst)
        run: |
          d="$RUNNER_TEMP/nm"
          mkdir -p "$d" && cd "$d"
          apt-get download network-manager libnm0
          for f in *.deb; do dpkg -x "$f" root; done
          lib="$(dirname "$(find "$d/root/usr/lib" -name 'libnm.so.0' | head -n1)")"
          printf '#!/bin/sh\nLD_LIBRARY_PATH=%s exec %s "$@"\n' "$lib" "$d/root/usr/bin/nmcli" >"$d/nmcli"
          chmod +x "$d/nmcli"
          "$d/nmcli" --version
          echo "GC_TEST_NMCLI=$d/nmcli" >> "$GITHUB_ENV"
      - name: rpi/check-config.sh
        run: sudo --preserve-env=PATH,GC_TEST_NMCLI rpi/check-config.sh

  edge-isolated:
    # Edge-Container ohne Netz (Compose: network_mode: none): der Edge-Host
    # läuft in einem leeren Netz-Namespace (unshare -n), das „Gateway“ im
    # normalen Netz – Isolation erkannt, direkte Verbindung scheitert, Kanal,
    # Paket, UDP und HTTP laufen über den Gateway-Socket, Internet abgelehnt.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://npm.pkg.github.com/', scope: '@callmetechie' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}' }
      - name: Edge-Host im leeren Netz-Namespace
        run: sudo "$(command -v node)" tests/live/edge-isolated-live.js

  mqtt-tls:
    # MQTT-Broker mit TLS (docs/edge.md „MQTT“): ein echter Mosquitto als Benutzer
    # 61001 mit den Rechten der Compose-Datei – Port 8883 mit dem selbst erzeugten
    # Zertifikat des Gateways (Fingerabdruck aus dem Status), Port 1883 daneben.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://npm.pkg.github.com/', scope: '@callmetechie' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}' }
      - name: Mosquitto (nur das Programm, der Dienst des Pakets bleibt aus)
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          sudo systemctl disable --now mosquitto || true
          /usr/sbin/mosquitto -h | head -n 1 || true
      - name: AppArmor-Profil des Pakets um das Testverzeichnis ergänzen
        # ab Ubuntu 26.04 bringt das Paket apparmor ein Profil für /usr/sbin/mosquitto mit,
        # das nur /etc/mosquitto und /var/lib/mosquitto zulässt – der Test legt Konfiguration,
        # Schlüssel und data/ unter /tmp/gc-mqtt-live-* an (wie /gc-mqtt und /gc-mqtt-conf
        # im Container). Der Weg dafür ist die lokale Ergänzung des Profils.
        run: |
          if [ -f /etc/apparmor.d/mosquitto ]; then
            printf '%s\n' '# GateControl CI: tests/live/mqtt-tls-live.js' \
              '/tmp/gc-mqtt-live-*/ r,' '/tmp/gc-mqtt-live-*/** rwk,' | sudo tee /etc/apparmor.d/local/mosquitto
            sudo apparmor_parser -r /etc/apparmor.d/mosquitto
          else
            echo "kein AppArmor-Profil für mosquitto"
          fi
      - name: Broker mit TLS-Listener
        run: sudo env MOSQUITTO=/usr/sbin/mosquitto "$(command -v node)" tests/live/mqtt-tls-live.js

  edge-fence:
    # Netzgrenze des Edge-Containers (nur noch für alte Compose-Dateien mit Edge
    # im Host-Netz) gegen den echten Kernel, je Backend in einem eigenen
    # Netz-Namespace: nftables und legacy-iptables.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: nftables + iptables-legacy
        run: |
          sudo apt-get install -y nftables iptables
          sudo modprobe -a nf_tables ip_tables ip6_tables xt_owner || true
          nft --version; iptables-legacy --version
      - name: nftables
        run: sudo unshare -n env GC_FENCE_BACKEND=nft "$(command -v node)" tests/live/edge-fence-live.js
      - name: iptables-legacy (owner match)
        run: |
          sudo unshare -n env GC_FENCE_BACKEND=iptables \
            GC_FENCE_IPTABLES=iptables-legacy GC_FENCE_IPTABLES_RESTORE=iptables-legacy-restore \
            GC_FENCE_IP6TABLES=ip6tables-legacy GC_FENCE_IP6TABLES_RESTORE=ip6tables-legacy-restore \
            "$(command -v node)" tests/live/edge-fence-live.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://npm.pkg.github.com/', scope: '@callmetechie' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}' }
      - run: npm run lint
      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile }
      - name: KICS (IaC)
        uses: checkmarx/kics-github-action@v2.1.20
        with:
          path: '.'
          fail_on: high
          exclude_queries: fd54f200-402c-4333-a5a4-36ef6709af2f

  simplification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx jscpd src || true
      - run: npx knip || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ github.token }}' }

  dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://npm.pkg.github.com/', scope: '@callmetechie' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}' }
      - run: npm audit --audit-level=high
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: github/codeql-action/init@v3
        with: { languages: javascript }
      - uses: github/codeql-action/analyze@v3
      - run: npx njsscan src || true

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [20, 22] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', registry-url: 'https://npm.pkg.github.com/', scope: '@callmetechie' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}' }
      - name: poppler-utils, tesseract, LibreOffice (Drucken & Scannen, tests/print_*.test.js – wie im Image)
        run: |
          pk="poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui"
          sudo apt-get install -y --no-install-recommends $pk || (sudo apt-get update && sudo apt-get install -y --no-install-recommends $pk)
      - name: Tests
        # Explizite Dateiliste: Node 22 nimmt `tests/` als Modul statt als Ordner und
        # führt dann gar nichts aus. pipefail: sonst verschluckt `tee` den Fehlercode.
        shell: bash
        run: |
          set -o pipefail
          node --test --experimental-test-coverage --test-force-exit $(find tests -name '*.test.js' | sort) | tee test-output.txt
      - name: Check coverage
        run: |
          # Extract "all files" line coverage pct from node --test coverage block
          LINES=$(grep -oE 'all files[^0-9]+[0-9.]+[^0-9]+[0-9.]+[^0-9]+[0-9.]+' test-output.txt | head -1 | grep -oE '[0-9.]+' | tail -1 || echo "0")
          echo "Line coverage: $LINES%"
          if [ -z "$LINES" ] || [ "$LINES" = "0" ]; then
            echo "Could not parse coverage — skipping check (coverage report format may differ)"
            exit 0
          fi
          awk -v v="$LINES" 'BEGIN{exit (v+0 < 70)}' || { echo "Coverage below 70%"; exit 1; }

  office-image:
    # Dienst office (Dockerfile, target office): nativ für amd64 bauen und LibreOffice
    # wirklich starten. Im Release (QEMU, arm64/armv7) läuft soffice beim Bauen nicht.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build office image (amd64)
        run: docker build --target office -t gc-office-test .
      - name: soffice --version
        run: docker run --rm --entrypoint soffice gc-office-test --version

  umwandeln-image:
    # Dienst umwandeln (Dockerfile, target umwandeln, docs/transcode.md): Image bauen und im
    # Container mit den Schutzoptionen der Compose-Datei (kein Netz, keine Rechte, nicht root,
    # read-only) ein erzeugtes 10-Bit-Video wirklich umwandeln – auf dem Software-Weg, weil der
    # Runner keine Intel-Grafik hat. VAAPI selbst prüft nur ein echtes Gerät.
    # Beide ffmpeg-Varianten (Dockerfile, ARG UMW_FFMPEG): jellyfin (Standard) und debian.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { ffmpeg: [jellyfin, debian] }
    steps:
      - uses: actions/checkout@v4
      - name: Build umwandeln image (amd64, ${{ matrix.ffmpeg }})
        run: docker build --target umwandeln --build-arg UMW_FFMPEG=${{ matrix.ffmpeg }} -t gc-umwandeln-test .
      - name: ffmpeg, ffprobe, vainfo, Encoder
        run: |
          docker run --rm --entrypoint ffmpeg gc-umwandeln-test -hide_banner -version | head -n 1
          docker run --rm --entrypoint ffprobe gc-umwandeln-test -hide_banner -version | head -n 1
          docker run --rm --entrypoint sh gc-umwandeln-test -c 'command -v vainfo && id'
          docker run --rm --entrypoint sh gc-umwandeln-test -c 'ffmpeg -hide_banner -encoders 2>/dev/null | grep -E " (h264_vaapi|libx264) "'
          docker run --rm --entrypoint sh gc-umwandeln-test -c 'ffmpeg -hide_banner -encoders 2>/dev/null | grep -c " h264_vaapi "'
          docker run --rm --entrypoint cat gc-umwandeln-test /usr/share/doc/gatecontrol-umwandeln/NOTICE.txt | head -n 8
          if [ "${{ matrix.ffmpeg }}" = jellyfin ]; then
            docker run --rm --entrypoint test gc-umwandeln-test -s /usr/share/doc/jellyfin-ffmpeg8/copyright
          else
            docker run --rm --entrypoint test gc-umwandeln-test -s /usr/share/doc/ffmpeg/copyright
            docker run --rm --entrypoint sh gc-umwandeln-test -c '! ffmpeg -hide_banner -buildconf 2>/dev/null | grep -q fdk'
            docker run --rm --entrypoint dpkg-query gc-umwandeln-test -W ffmpeg intel-media-va-driver-non-free vainfo
          fi
          docker image inspect -f 'Größe: {{.Size}}' gc-umwandeln-test
      - name: Compose-Datei mit dem Profil umwandeln
        run: |
          docker compose -f docker-compose.example.yml --profile umwandeln config -q
          docker compose -f docker-compose.example.yml --profile umwandeln config --format json | jq '.services.umwandeln | {user, group_add, network_mode, cap_drop, read_only, devices, environment}'
      - name: Umwandeln im Container (Software-Weg, Schutzoptionen der Compose-Datei)
        run: bash tests/live/umwandeln-image.sh gc-umwandeln-test

  mutation:
    runs-on: ubuntu-latest
    needs: unit
    # Run only when critical files change OR when PR has "mutation-test" label
    # (prevents feedback loop from chore: bump commits, doc-only pushes)
    if: |
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: bump version')) ||
      contains(github.event.pull_request.labels.*.name, 'mutation-test')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://npm.pkg.github.com/', scope: '@callmetechie' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}' }
      - name: poppler-utils, tesseract, LibreOffice (Drucken & Scannen, tests/print_*.test.js – wie im Image)
        run: |
          pk="poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui"
          sudo apt-get install -y --no-install-recommends $pk || (sudo apt-get update && sudo apt-get install -y --no-install-recommends $pk)
      - run: npx stryker run
      - uses: actions/upload-artifact@v4
        with: { name: mutation-report, path: reports/mutation/ }
