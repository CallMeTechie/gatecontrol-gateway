name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          find src tests -name "*.js" -exec node --check {} +
      - name: gc-blescan (Funk, natives Hilfsprogramm) übersetzen
        run: gcc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/gc-blescan" native/gc-blescan.c
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Shellcheck scripts/
        run: |
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck -S warning "${files[@]}"
          fi

  rpi-image-config:
    # Schneller Struktur-Test des Raspberry-Pi-Images (kein Image-Bau; der
    # läuft im Release bzw. per Hand über rpi-image.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: nmcli für den Keyfile-Test (nur entpackt, kein NetworkManager-Dienst)
        run: |
          d="$RUNNER_TEMP/nm"
          mkdir -p "$d" && cd "$d"
          apt-get download network-manager libnm0
          for f in *.deb; do dpkg -x "$f" root; done
          lib="$(dirname "$(find "$d/root/usr/lib" -name 'libnm.so.0' | head -n1)")"
          printf '#!/bin/sh\nLD_LIBRARY_PATH=%s exec %s "$@"\n' "$lib" "$d/root/usr/bin/nmcli" >"$d/nmcli"
          chmod +x "$d/nmcli"
          "$d/nmcli" --version
          echo "GC_TEST_NMCLI=$d/nmcli" >> "$GITHUB_ENV"
      - name: rpi/check-config.sh
        run: sudo --preserve-env=PATH,GC_TEST_NMCLI rpi/check-config.sh

  edge-isolated:
    # Edge-Container ohne Netz (Compose: network_mode: none): der Edge-Host
    # läuft in einem leeren Netz-Namespace (unshare -n), das „Gateway“ im
    # normalen Netz – Isolation erkannt, direkte Verbindung scheitert, Kanal,
    # Paket, UDP und HTTP laufen über den Gateway-Socket, Internet abgelehnt.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://npm.pkg.github.com/', scope: '@callmetechie' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}' }
      - name: Edge-Host im leeren Netz-Namespace
        run: sudo "$(command -v node)" tests/live/edge-isolated-live.js

  edge-fence:
    # Netzgrenze des Edge-Containers (nur noch für alte Compose-Dateien mit Edge
    # im Host-Netz) gegen den echten Kernel, je Backend in einem eigenen
    # Netz-Namespace: nftables und legacy-iptables.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: nftables + iptables-legacy
        run: |
          sudo apt-get install -y nftables iptables
          sudo modprobe -a nf_tables ip_tables ip6_tables xt_owner || true
          nft --version; iptables-legacy --version
      - name: nftables
        run: sudo unshare -n env GC_FENCE_BACKEND=nft "$(command -v node)" tests/live/edge-fence-live.js
      - name: iptables-legacy (owner match)
        run: |
          sudo unshare -n env GC_FENCE_BACKEND=iptables \
            GC_FENCE_IPTABLES=iptables-legacy GC_FENCE_IPTABLES_RESTORE=iptables-legacy-restore \
            GC_FENCE_IP6TABLES=ip6tables-legacy GC_FENCE_IP6TABLES_RESTORE=ip6tables-legacy-restore \
            "$(command -v node)" tests/live/edge-fence-live.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://npm.pkg.github.com/', scope: '@callmetechie' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}' }
      - run: npm run lint
      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile }
      - name: KICS (IaC)
        uses: checkmarx/kics-github-action@v2.1.20
        with:
          path: '.'
          fail_on: high
          exclude_queries: fd54f200-402c-4333-a5a4-36ef6709af2f

  simplification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx jscpd src || true
      - run: npx knip || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ github.token }}' }

  dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://npm.pkg.github.com/', scope: '@callmetechie' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}' }
      - run: npm audit --audit-level=high
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: github/codeql-action/init@v3
        with: { languages: javascript }
      - uses: github/codeql-action/analyze@v3
      - run: npx njsscan src || true

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [20, 22] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', registry-url: 'https://npm.pkg.github.com/', scope: '@callmetechie' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}' }
      - name: poppler-utils, tesseract, LibreOffice (Drucken & Scannen, tests/print_*.test.js – wie im Image)
        run: |
          pk="poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui"
          sudo apt-get install -y --no-install-recommends $pk || (sudo apt-get update && sudo apt-get install -y --no-install-recommends $pk)
      - run: node --test --experimental-test-coverage --test-force-exit tests/ | tee test-output.txt
      - name: Check coverage
        run: |
          # Extract "all files" line coverage pct from node --test coverage block
          LINES=$(grep -oE 'all files[^0-9]+[0-9.]+[^0-9]+[0-9.]+[^0-9]+[0-9.]+' test-output.txt | head -1 | grep -oE '[0-9.]+' | tail -1 || echo "0")
          echo "Line coverage: $LINES%"
          if [ -z "$LINES" ] || [ "$LINES" = "0" ]; then
            echo "Could not parse coverage — skipping check (coverage report format may differ)"
            exit 0
          fi
          awk -v v="$LINES" 'BEGIN{exit (v+0 < 70)}' || { echo "Coverage below 70%"; exit 1; }

  office-image:
    # Dienst office (Dockerfile, target office): nativ für amd64 bauen und LibreOffice
    # wirklich starten. Im Release (QEMU, arm64/armv7) läuft soffice beim Bauen nicht.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build office image (amd64)
        run: docker build --target office -t gc-office-test .
      - name: soffice --version
        run: docker run --rm --entrypoint soffice gc-office-test --version

  mutation:
    runs-on: ubuntu-latest
    needs: unit
    # Run only when critical files change OR when PR has "mutation-test" label
    # (prevents feedback loop from chore: bump commits, doc-only pushes)
    if: |
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: bump version')) ||
      contains(github.event.pull_request.labels.*.name, 'mutation-test')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://npm.pkg.github.com/', scope: '@callmetechie' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.GH_PACKAGES_TOKEN }}' }
      - name: poppler-utils, tesseract, LibreOffice (Drucken & Scannen, tests/print_*.test.js – wie im Image)
        run: |
          pk="poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui"
          sudo apt-get install -y --no-install-recommends $pk || (sudo apt-get update && sudo apt-get install -y --no-install-recommends $pk)
      - run: npx stryker run
      - uses: actions/upload-artifact@v4
        with: { name: mutation-report, path: reports/mutation/ }
