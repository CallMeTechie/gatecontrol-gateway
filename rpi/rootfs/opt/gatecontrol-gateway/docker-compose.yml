# GateControl Home Gateway — Raspberry-Pi-Image
#
# Abgeleitet aus docker-compose.example.yml (gleiche Sicherheits-Optionen).
# Diese Datei gehört zum Image; gestartet wird sie von
# gatecontrol-gateway.service (/usr/local/sbin/gatecontrol-start).
#
#   ./config/gateway.env   ← kommt beim Start von der Boot-Partition
#   ./gateway-state/       ← Auto-Update-Flag, last-pull, hardware.json
#   ./gateway-cache/       ← Zwischenspeicher (oder CACHE_DIR aus settings.txt
#                            → GC_CACHE_DIR in .env, z. B. eine USB-Platte)
#   ./deconz/              ← deCONZ-Daten (nur mit RaspBee II / ConBee)
#   Volumes edge-*         ← Edge-Container (Pakete, Zugangsdaten, Status)
#   ./.env                 ← schreibt gatecontrol-start bei jedem Start
#                            (TZ, GC_CACHE_DIR)
#
# deCONZ/Phoscon (docs/radio.md): gatecontrol-start nimmt den Dienst mit, wenn
# beim Start ein RaspBee II / ConBee erkannt wird oder Zigbee in GateControl
# eingeschaltet ist (gateway-state/radio.json); schaltet man Zigbee später
# ein, legt gatecontrol-radio.path ihn an. Ein/aus und das Gerät bestimmt das
# Gateway über radio-ctl (zigbee.env) – der Wächter im Dienst führt aus.
#
# Ports (alle host network):
#   Gateway:  GC_PROXY_PORT (8080) + GC_API_PORT (9876) — nur Tunnel-IP,
#             dazu L4-Routen-Ports (Tunnel-IP) und Egress-Ports (LAN-IP).
#             Wenn in GateControl eingeschaltet, nur LAN-Adressen:
#             53/udp+tcp (DNS-Filter), 8443/tcp (Zwischenspeicher).
#   Edge:     kein eigenes Netz (network_mode: none); UDP-/mDNS-Ports, die
#             genehmigte Plugin-Teile binden (≥ 1024), öffnet das Gateway.
#   deCONZ:   8090 (REST-API + Phoscon-Weboberfläche), 8091 (WebSocket) —
#             auf allen Adressen. Diese Ports nicht für L4-Routen dieses
#             Gateways verwenden.

name: gatecontrol-gateway

services:
  gateway:
    image: ghcr.io/callmetechie/gatecontrol-gateway:latest
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN         # wg-quick + TUN device
      - NET_BIND_SERVICE  # L4 routes on ports <1024
      - NET_RAW           # keepalived VRRP + GARP
      - SETGID            # keepalived enable_script_security
      - SETUID            # keepalived enable_script_security
    # security_opt.no-new-privileges bewusst NICHT gesetzt — siehe
    # docker-compose.example.yml (wg-quick braucht ambient NET_ADMIN).
    read_only: true
    user: "0:0"
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /tmp
      - /run
      - /etc/wireguard
    volumes:
      - ./config:/config:ro
      - ./gateway-state:/state
      - ${GC_CACHE_DIR:-./gateway-cache}:/cache
      - type: volume
        source: edge-run
        target: /run/gc-edge
        volume: { nocopy: true }
      - type: volume
        source: edge-status
        target: /run/gc-edge-status
        read_only: true
        volume: { nocopy: true }
      - type: volume
        source: edge-mqtt-conf
        target: /gc-mqtt-conf
        volume: { nocopy: true }
      - type: volume            # nur für Besitzer 61001 eines neuen Volumes
        source: edge-mqtt
        target: /gc-mqtt
        read_only: true
      - type: volume            # Funk (docs/radio.md): Steuerdatei für den deCONZ-Dienst
        source: radio-ctl
        target: /gc-radio
        volume: { nocopy: true }
    environment:
      - LOG_LEVEL=info
      - GATEWAY_ENV_PATH=/config/gateway.env
      - WG_QUICK_USERSPACE_IMPLEMENTATION=wireguard-go
      # Ortszeit (Rückfall – die Zeitzone vom Server hat Vorrang); .env schreibt gatecontrol-start
      - TZ=${TZ:-Etc/UTC}
    healthcheck:
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Edge-Container für Plugin-Teile (docs/edge.md) — gleiche Optionen wie in
  # docker-compose.example.yml (CI prüft das): ohne Netz, alles über den
  # Gateway-Socket. Bleibt untätig, bis der Server Edge für dieses Gateway
  # einschaltet; abschaltbar mit EDGE=off in settings.txt.
  edge:
    image: ghcr.io/callmetechie/gatecontrol-gateway:latest
    entrypoint: ["/sbin/tini", "--", "node", "src/edge/main.js"]
    restart: unless-stopped
    network_mode: none
    user: "61001:61001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 512m
    pids_limit: 256
    volumes:
      - type: volume
        source: edge-run
        target: /run/gc-edge
        read_only: true
        volume: { nocopy: true }
      - type: volume
        source: edge-status
        target: /run/gc-edge-status
        volume: { nocopy: true }
      - edge-state:/state-edge
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "node", "src/edge/healthcheck.js"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Lokaler MQTT-Broker (docs/edge.md "MQTT"). Läuft untätig (nur ein kleiner
  # Wächter), bis der Server MQTT einschaltet; der Gateway-Container schreibt
  # dann mosquitto.conf/passwd/acl nach /gc-mqtt-conf (der Edge-Container
  # kommt da nicht dran). Der Wächter kopiert sie nach /gc-mqtt, startet
  # Mosquitto bei geänderter Konfiguration neu und schickt bei geänderten
  # Konten SIGHUP. Port 1883 nur an LAN-Adressen, ohne anonyme Anmeldung.
  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    entrypoint:
      - /bin/sh
      - -c
      - |
        G=/gc-mqtt-conf; C=/gc-mqtt; p=""; s=""; r=""
        halt() { if [ -n "$$p" ]; then kill "$$p" 2>/dev/null; wait "$$p" 2>/dev/null; fi; p=""; }
        take() { for f in mosquitto.conf passwd acl; do cp "$$G/$$f" "$$C/.$$f" && chmod 600 "$$C/.$$f" && mv -f "$$C/.$$f" "$$C/$$f" || return 1; done; }
        trap 'halt; exit 0' TERM INT
        mkdir -p "$$C/data"
        while :; do
          if [ -f "$$G/enabled" ] && [ -f "$$G/mosquitto.conf" ]; then
            n="$$(cksum < "$$G/mosquitto.conf")"
            if [ -n "$$p" ] && ! kill -0 "$$p" 2>/dev/null; then p=""; fi
            if [ -z "$$p" ] || [ "$$n" != "$$s" ]; then
              halt; r="$$(cat "$$G/reload" 2>/dev/null)"
              if take; then mosquitto -c "$$C/mosquitto.conf" & p=$$!; s="$$n"; fi
            elif [ "$$(cat "$$G/reload" 2>/dev/null)" != "$$r" ]; then
              r="$$(cat "$$G/reload" 2>/dev/null)"; take && kill -HUP "$$p"
            fi
          else
            halt; s=""
          fi
          sleep 2 & wait $$!
        done
    restart: unless-stopped
    network_mode: host
    user: "61001:61001"       # Gruppe 61001: liest die Dateien des Gateways
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 128m
    pids_limit: 32
    depends_on:
      - gateway               # legt die Volumes an (edge-mqtt mit Besitzer 61001 aus dem Image)
    volumes:
      - type: volume          # Broker-Dateien vom Gateway (nur lesen)
        source: edge-mqtt-conf
        target: /gc-mqtt-conf
        read_only: true
        volume: { nocopy: true }
      - type: volume          # Kopie der Dateien (0600) + Mosquitto-Daten (data/)
        source: edge-mqtt
        target: /gc-mqtt
        volume: { nocopy: true }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Zigbee (docs/radio.md) – wie in docker-compose.example.yml, nur ohne Profil
  deconz:
    image: @DECONZ_IMAGE@
    entrypoint:
      - /bin/sh
      - -c
      - |
        C=/gc-radio; p=""; s=""; st=idle; dt=-
        say() { st="$$1"; dt="$${2:--}"; printf '%s %s %s\n' "$$st" "$$dt" "$$(date +%s)" >"$$C/.deconz.state" && mv -f "$$C/.deconz.state" "$$C/deconz.state"; }
        halt() { if [ -n "$$p" ]; then kill "$$p" 2>/dev/null; wait "$$p" 2>/dev/null; fi; p=""; }
        dead() { [ ! -e "/proc/$$1" ] || grep -q '^State:[[:space:]]*Z' "/proc/$$1/status" 2>/dev/null; }
        trap 'halt; say idle; exit 0' TERM INT
        while :; do
          if [ -f "$$C/zigbee.env" ]; then
            n="$$(cksum <"$$C/zigbee.env")"
            if [ -n "$$p" ] && dead "$$p"; then wait "$$p"; say exit "$$?"; p=""; sleep 8; fi
            if [ -z "$$p" ] || [ "$$n" != "$$s" ]; then
              halt; s="$$n"
              dv="$$(sed -n 's/^DEVICE=\(tty[A-Z]\{3\}[0-9]\{1,3\}\)$$/\1/p' "$$C/zigbee.env")"
              mm="$$(sed -n 's/^DEV=\([0-9]\{3\}\):\([0-9]\{1,7\}\)$$/\1 \2/p' "$$C/zigbee.env")"
              bd="$$(sed -n 's/^BAUD=\([0-9]\{1,6\}\)$$/\1/p' "$$C/zigbee.env")"
              case "$$dv:$${mm%% *}" in
                ttyACM*:166|ttyUSB*:188|ttyAMA*:204)
                  rm -f "/dev/$$dv"
                  if mknod "/dev/$$dv" c $$mm && chgrp dialout "/dev/$$dv" && chmod 660 "/dev/$$dv"; then
                    DECONZ_DEVICE="/dev/$$dv" DECONZ_BAUDRATE="$${bd:-0}" /start.sh & p=$$!; say running "$$dv"
                  else say wait mknod; fi ;;
                *) say wait invalid ;;
              esac
            else say "$$st" "$$dt"; fi
          else
            halt; s=""; say idle
          fi
          sleep 2 & wait $$!
        done
    restart: unless-stopped
    network_mode: host
    # nur diese Gerätearten darf der Wächter anlegen und deCONZ öffnen: ttyACM
    # (ConBee II), ttyUSB (ConBee III/ConBee), ttyAMA (RaspBee auf der GPIO-Leiste)
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 188:* rmw"
      - "c 204:* rmw"
    volumes:
      - ./deconz:/opt/deCONZ
      - type: volume            # Steuerdatei vom Gateway, Zustand zurück
        source: radio-ctl
        target: /gc-radio
        volume: { nocopy: true }
    environment:
      - TZ=${TZ:-Etc/UTC}
      - DECONZ_WEB_PORT=8090
      - DECONZ_WS_PORT=8091
      - DECONZ_VNC_MODE=0
      - DECONZ_UPNP=1
      - DEBUG_INFO=1
      - DEBUG_APS=0
      - DEBUG_ZCL=0
      - DEBUG_ZDP=0
      - DEBUG_OTA=0
      - DEBUG_HTTP=0
    healthcheck:
      test: ["CMD-SHELL", "case \"$$(cut -d' ' -f1 /gc-radio/deconz.state 2>/dev/null)\" in running) curl -fs -m 4 -o /dev/null http://127.0.0.1:8090/api/config ;; *) true ;; esac"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  edge-run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=0,gid=61001,mode=2750"
  edge-status:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=61001,gid=61001,mode=0755"
  edge-mqtt-conf:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=0,gid=61001,mode=2750"
  edge-state:
  edge-mqtt:
  radio-ctl:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=0,gid=0,mode=0755"
